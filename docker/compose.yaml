services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: aetheric-web:local
    env_file:
      - ${AETHERIC_ENV_FILE:-.env.local}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    entrypoint:
      - /bin/sh
      - -c
    command:
      - update-ca-certificates >/dev/null && exec dotnet AethericForge.Web.dll
    init: true
    extra_hosts:
      - "sso-dev.aethericforge.ca:host-gateway"
      - "sso.aethericforge.ca:host-gateway"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ${STEP_CA_ROOT_CERT:-./.certificates/step-ca-root-ca.crt}:/usr/local/share/ca-certificates/step-ca-root-ca.crt:ro
